{% extends "base.html" %}
{% block title %}{{ test.title }}{% endblock %}

{% block content %}
<div class="test-header">
    <h2>{{ test.title }}</h2>
    <div class="timer" id="timer" data-minutes="{{ test.duration_minutes }}">--:--</div>
</div>

<form method="POST" action="{{ url_for('submit_test', test_id=test.id) }}" id="testForm">
    {% for q in questions %}
    <div class="card question">
        <p class="q-text">{{ loop.index }}. {{ q.question_text }}</p>
        <label class="option"><input type="radio" name="q{{ q.id }}" value="A"> A) {{ q.option_a }}</label>
        <label class="option"><input type="radio" name="q{{ q.id }}" value="B"> B) {{ q.option_b }}</label>
        <label class="option"><input type="radio" name="q{{ q.id }}" value="C"> C) {{ q.option_c }}</label>
        <label class="option"><input type="radio" name="q{{ q.id }}" value="D"> D) {{ q.option_d }}</label>
    </div>
    {% endfor %}

    <button class="btn" type="submit">Тестті аяқтау</button>
</form>

<script>
    const timerEl = document.getElementById("timer");
    let seconds = parseInt(timerEl.dataset.minutes) * 60;

    function tick() {
        const m = String(Math.floor(seconds / 60)).padStart(2, "0");
        const s = String(seconds % 60).padStart(2, "0");
        timerEl.textContent = m + ":" + s;
        if (seconds <= 0) {
            document.getElementById("testForm").submit();
            return;
        }
        seconds--;
        setTimeout(tick, 1000);
    }
    tick();
</script>
{% endblock %}
