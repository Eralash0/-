{% extends "base.html" %}
{% block title %}Кіру{% endblock %}

{% block content %}
<div class="card form-card">
    <h2>Жүйеге кіру</h2>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Құпиясөз</label>
        <input type="password" name="password" required>

        <button class="btn" type="submit">Кіру</button>
    </form>
    <p class="hint">Аккаунт жоқ па? <a href="{{ url_for('register') }}">Тіркелу</a></p>
</div>
{% endblock %}
